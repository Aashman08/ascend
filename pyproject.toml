[project]
name = "ascend-checkout-api"
version = "0.1.0"
description = "REST API for finance terms and insurance policies"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.4",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
